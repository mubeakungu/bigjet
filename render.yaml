services:
  - type: web
    name: big-jet-backend
    env: node
    region: oregon
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_HOST
        fromDatabase:
          name: big-jet-db
          property: host

  - type: static_site
    name: big-jet-frontend
    region: oregon
    rootDir: frontend
    buildCommand: npm install && npm run build
    publishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://big-jet-backend.onrender.com/api

databases:
  - name: big-jet-db
    engine: postgres
    version: 14
    region: oregon
